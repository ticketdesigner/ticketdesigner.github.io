<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b3d24">
<link rel="canonical" href="https://ticketdesigner.github.io/admin.html">
<meta property="og:type" content="website"><meta property="og:site_name" content="Ticket Designer"><meta property="og:url" content="https://ticketdesigner.github.io/admin.html">
<meta property="og:title" content="Access Management | Ticket Designer"><meta property="og:description" content="Manage staff roles, scope, sessions, and access from one secure control center.">
<meta property="og:image" content="https://ticketdesigner.github.io/admin-og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://ticketdesigner.github.io/admin-og.jpg">
<title>Access Management | Ticket Designer</title>
<style>
:root{--g:#0b3d24;--g2:#145d37;--gold:#c9a24b;--bg:#f3f6f4;--ink:#18231c;--muted:#66736b;--line:#d6ded8;--danger:#a52c2c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--g);color:white;border-bottom:4px solid var(--gold);padding:18px}.head,.wrap{max-width:1380px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}.head h1{margin:0}.wrap{padding:22px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 7px 20px rgba(0,0,0,.04)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#eef3ef;color:var(--g);border:1px solid #cad6cd}.danger{background:#fff1f1;color:var(--danger);border:1px solid #e0b8b8}.ghost{background:#fff;color:var(--g);border:1px solid var(--line)}input,select{width:100%;padding:10px;border:1px solid #bdc8c0;border-radius:8px;background:#fff;font:inherit}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field{margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:10px;border-bottom:1px solid #e4e9e5;text-align:left;font-size:13px}th{background:#f7f9f7;font-size:12px;color:#526057}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:700}.badge.off{background:#eee;color:#777}.hint{font-size:12px;color:var(--muted)}.status{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#edf7ef;color:#245f35}.status.error{background:#fff0f0;color:#922626}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.hidden{display:none!important}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:22px}.modal h2{margin-top:0;color:var(--g)}.summary{background:#f7faf8;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}.summary ul{margin:8px 0;padding-left:20px}.search{max-width:380px}.scopeText{color:#e7efe9;font-size:13px}@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}.top,.head{align-items:flex-start;flex-direction:column}table{min-width:900px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Access Management</h1><div class="scopeText" id="ownerLine">Checking session…</div></div><div class="toolbar"><a class="btn secondary" href="dashboard.html" style="text-decoration:none">Dashboard</a><button id="logoutBtn" class="btn ghost">Log Out</button></div></div></header>
<div class="wrap">
  <div class="card">
    <div class="top"><div><h2 style="margin:0;color:var(--g)">Administrators</h2><div class="hint">The system generates IDs and technical scope values automatically.</div></div><button id="newBtn" class="btn primary">+ Add Administrator</button></div>
    <div class="toolbar" style="margin-bottom:12px"><input class="search" id="search" placeholder="Search name, role, chapter, event or status"><select id="roleFilter" style="max-width:220px"><option value="">All roles</option><option>System Owner</option><option>Regional Admin</option><option>Chapter Admin</option><option>Event Organizer</option><option>Gate Staff</option></select></div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Scope</th><th>Status</th><th>Last Login</th><th>Last Activity</th><th>Email</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="status" class="status"></div>
  </div>
  <div class="card" style="margin-top:18px"><h2 style="margin-top:0;color:var(--g)">Recent Temporary Access</h2><div id="delegations" class="hint">No temporary approvals yet.</div></div>
</div>
<div id="modalBack" class="modalback hidden"><div class="modal"><h2 id="modalTitle">Add Administrator</h2>
  <div class="grid2"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Role</label><select id="role"><option>System Owner</option><option>Regional Admin</option><option>Chapter Admin</option><option>Event Organizer</option><option>Gate Staff</option></select></div></div>
  <div class="grid3"><div class="field" id="orgWrap"><label>Organization</label><select id="org"><option value="SLPPNA">SLPP North America</option></select></div><div class="field" id="chapterWrap"><label>Chapter</label><select id="chapter"></select></div><div class="field" id="eventWrap"><label>Event</label><select id="event"></select></div></div>
  <div class="grid2"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div></div>
  <div class="field"><label id="passLabel">Passcode</label><input id="passcode" type="password" autocomplete="new-password"><div class="hint" id="passHint">Minimum 8 characters.</div></div>
  <div class="field"><label><input id="active" type="checkbox" checked style="width:auto"> Active</label></div>
  <div class="summary"><strong>Access Summary</strong><div id="accessSummary" class="hint"></div></div>
  <div class="toolbar" style="justify-content:flex-end"><button id="duplicateBtn" class="btn secondary hidden">Duplicate Access</button><button id="cancelBtn" class="btn ghost">Cancel</button><button id="saveBtn" class="btn primary">Create Administrator</button></div><div id="modalStatus" class="status"></div>
</div></div>
<script src="assets/js/app-config.js"></script>
<script>
const APP=window.SLPP_APP_CONFIG||{}, ENDPOINT=APP.ticketConfigEndpoint, SESSION=sessionStorage.getItem('slppSessionToken')||'';let DATA={admins:[],chapters:[],events:[],delegations:[]},EDIT=null,DUPLICATE=false;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(el,t,e=false){el.textContent=t;el.className='status'+(e?' error':'');el.style.display='block'}function date(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString()}
async function api(action,p={}){if(!SESSION)throw new Error('Your session has expired. Please sign in again.');const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,sessionToken:SESSION,...p})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Request failed.');return d}
function chapterName(code){const c=DATA.chapters.find(x=>x.chapterCode===code);return c?c.chapterName:code}function eventName(id){const e=DATA.events.find(x=>x.eventId===id);return e?e.eventName:id}
function scope(a){if(a.role==='System Owner')return'Entire system';if(a.role==='Regional Admin')return a.organizationId;if(a.role==='Chapter Admin')return `${chapterName(a.chapterCode)} · All chapter events`;return `${chapterName(a.chapterCode)} · ${eventName(a.eventId)}`}
function render(){const q=$('search').value.toLowerCase(),rf=$('roleFilter').value;const list=DATA.admins.filter(a=>(!rf||a.role===rf)&&(!q||[a.adminName,a.role,scope(a),a.email,a.active?'active':'inactive'].join(' ').toLowerCase().includes(q)));$('rows').innerHTML=list.map(a=>`<tr><td><strong>${esc(a.adminName)}</strong><div class="hint">${esc(a.adminId)}</div></td><td>${esc(a.role)}</td><td>${esc(scope(a))}</td><td><span class="badge ${a.active?'':'off'}">${a.active?'Active':'Inactive'}</span></td><td>${esc(date(a.lastLoginAt))}</td><td>${esc(date(a.lastActivityAt))}</td><td>${esc(a.email||'')}</td><td><div class="toolbar"><button class="btn secondary" data-edit="${esc(a.adminId)}">Edit</button><button class="btn secondary" data-copy="${esc(a.adminId)}">Duplicate Access</button><button class="btn ghost" data-revoke="${esc(a.adminId)}">Revoke Sessions</button><button class="btn ${a.active?'danger':'primary'}" data-toggle="${esc(a.adminId)}">${a.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(DATA.admins.find(a=>a.adminId===b.dataset.edit)));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>open(DATA.admins.find(a=>a.adminId===b.dataset.copy),true));document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>revoke(b.dataset.revoke));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));
const ds=DATA.delegations||[];$('delegations').innerHTML=ds.length?ds.slice(0,20).map(d=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><strong>${esc(d.capability)}</strong> for ${esc(d.requesterAdminId)} · approved by ${esc(d.approverAdminId)} · event ${esc(eventName(d.eventId))} · expires ${esc(date(d.expiresAt))}</div>`).join(''):'No temporary approvals yet.'}
function eligibleChaptersForRole(){
  const org=$('org').value,r=$('role').value;
  const chapters=DATA.chapters.filter(c=>c.organizationId===org);
  if(r!=='Event Organizer'&&r!=='Gate Staff')return chapters;
  const activeChapterCodes=new Set(DATA.events.filter(e=>e.organizationId===org&&e.active).map(e=>e.chapterCode));
  return chapters.filter(c=>activeChapterCodes.has(c.chapterCode));
}
function fillChapters(preferred=''){
  const select=$('chapter'),current=preferred||select.value;
  const chapters=eligibleChaptersForRole();
  select.innerHTML=chapters.map(c=>`<option value="${esc(c.chapterCode)}">${esc(c.chapterName)}</option>`).join('');
  if(current&&chapters.some(c=>c.chapterCode===current))select.value=current;
}
function fillEvents(preferred=''){
  const org=$('org').value,ch=$('chapter').value,select=$('event'),current=preferred||select.value;
  const events=DATA.events.filter(e=>e.organizationId===org&&e.chapterCode===ch&&e.active);
  select.innerHTML=events.map(e=>`<option value="${esc(e.eventId)}">${esc(e.eventName)}</option>`).join('');
  if(current&&events.some(e=>e.eventId===current))select.value=current;
}
function updateAccessSummary(){
  const r=$('role').value,broad=r==='System Owner'||r==='Regional Admin',chapterRole=r==='Chapter Admin';
  const perms={"System Owner":['User Management','Organizations','Chapters','Event Designer','Vouchers','Check-In','Reports'],"Regional Admin":['Chapters','Event Designer','Vouchers','Check-In','Reports'],"Chapter Admin":['Event Designer','Vouchers','Check-In','Reports'],"Event Organizer":['Event Designer','Vouchers','Check-In','Reports'],"Gate Staff":['Check-In']}[r]||[];
  let sc=broad?(r==='System Owner'?'Entire system':'Organization'):chapterRole?(chapterName($('chapter').value)+' · All chapter events'):(chapterName($('chapter').value)+' · '+eventName($('event').value));
  $('accessSummary').innerHTML=`<div><strong>Scope:</strong> ${esc(sc)}</div><ul>${perms.map(x=>`<li>✓ ${esc(x)}</li>`).join('')}</ul>`;
}
function roleUI(){
  const r=$('role').value,broad=r==='System Owner'||r==='Regional Admin',chapterRole=r==='Chapter Admin';
  $('chapterWrap').style.display=broad?'none':'block';
  $('eventWrap').style.display=(broad||chapterRole)?'none':'block';
  if(!broad){fillChapters();if(!chapterRole)fillEvents()}
  updateAccessSummary();
}
function open(a=null,duplicate=false){EDIT=duplicate?null:a;DUPLICATE=duplicate;$('modalTitle').textContent=duplicate?'Duplicate Access':a?'Edit Administrator':'Add Administrator';$('name').value=duplicate?'':a?.adminName||'';$('role').value=a?.role||'Event Organizer';$('org').value=a?.organizationId||APP.defaultOrganization||'SLPPNA';fillChapters(a?.chapterCode&&a.chapterCode!=='ALL'?a.chapterCode:'');fillEvents(a?.eventId&&a.eventId!=='ALL'?a.eventId:'');$('email').value=duplicate?'':a?.email||'';$('phone').value=duplicate?'':a?.phone||'';$('passcode').value='';$('active').checked=duplicate?true:(a?!!a.active:true);$('passHint').textContent=a&&!duplicate?'Leave blank to keep the current passcode.':'Minimum 8 characters.';$('saveBtn').textContent=a&&!duplicate?'Save Changes':'Create Administrator';$('duplicateBtn').classList.toggle('hidden',!a||duplicate);roleUI();$('modalStatus').style.display='none';$('modalBack').classList.remove('hidden')}
async function save(){try{const r=$('role').value;let chapterCode='ALL',eventId='ALL';if(r==='Chapter Admin'){chapterCode=$('chapter').value}else if(r==='Event Organizer'||r==='Gate Staff'){chapterCode=$('chapter').value;eventId=$('event').value}const payload={admin:{adminId:EDIT?.adminId||'',adminName:$('name').value.trim(),role:r,organizationId:$('org').value,chapterCode,eventId,email:$('email').value.trim(),phone:$('phone').value.trim(),active:$('active').checked},newPasscode:$('passcode').value};if(!payload.admin.adminName)throw new Error('Name is required.');if(!EDIT&&!payload.newPasscode)throw new Error('A passcode is required for a new administrator.');await api('saveAdminPortalAdmin',payload);$('modalBack').classList.add('hidden');await load();msg($('status'),'Administrator saved.')}catch(e){msg($('modalStatus'),e.message,true)}}
async function toggle(id){const a=DATA.admins.find(x=>x.adminId===id);try{await api('setAdminPortalStatus',{adminId:id,active:!a.active});await load()}catch(e){msg($('status'),e.message,true)}}async function revoke(id){if(!confirm('Sign this user out of all active sessions?'))return;try{await api('revokeAdminSessions',{adminId:id});msg($('status'),'Active sessions revoked.')}catch(e){msg($('status'),e.message,true)}}
async function load(){const v=await api('verifyAdminPortal');$('ownerLine').textContent=`${v.admin.adminName} · ${v.admin.role}`;const d=await api('adminPortalData');DATA={admins:d.admins||[],chapters:d.chapters||[],events:d.events||[],delegations:d.delegations||[]};fillChapters();fillEvents();render()}
$('newBtn').onclick=()=>open();$('cancelBtn').onclick=()=>$('modalBack').classList.add('hidden');$('saveBtn').onclick=save;$('duplicateBtn').onclick=()=>{const a=EDIT;open(a,true)};$('role').onchange=()=>{fillChapters();fillEvents();roleUI()};$('org').onchange=()=>{fillChapters();fillEvents();updateAccessSummary()};$('chapter').onchange=()=>{fillEvents();updateAccessSummary()};$('event').onchange=updateAccessSummary;$('search').oninput=render;$('roleFilter').onchange=render;$('logoutBtn').onclick=async()=>{try{await api('logoutSession')}catch(_){}sessionStorage.clear();location.href='index.html'};
if(!SESSION)location.replace('index.html?error=session');else load().catch(e=>{alert(e.message);sessionStorage.clear();location.replace('index.html?error=session')});
</script>
</body></html>
